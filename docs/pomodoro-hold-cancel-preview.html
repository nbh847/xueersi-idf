<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>番茄时钟 · 引信取消样式</title>
<style>
:root{color-scheme:dark;--muted:#93928c;--line:#34332e;--gold:#e2ba78}*{box-sizing:border-box}body{margin:0;background:#141411;color:#efeee8;font-family:ui-sans-serif,-apple-system,"PingFang SC",sans-serif}main{max-width:1160px;margin:auto;padding:48px 32px 32px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold)}h1{font-size:34px;letter-spacing:-1px;font-weight:500;margin:14px 0}header p{font-size:14px;color:var(--muted);line-height:1.8;max-width:760px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:28px 0 24px;padding:16px 0;border-block:1px solid var(--line)}button{font:inherit;color:inherit;background:#272722;border:1px solid #45443b;border-radius:8px;padding:10px 16px;cursor:pointer}button:hover{border-color:var(--gold)}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.primary{background:#e2ba78;color:#201b12;border-color:#e2ba78}.toolbar small{color:var(--muted);margin-left:auto}label{font-size:13px;color:#bdbbb2;display:flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{border:1px solid var(--line);border-radius:16px;background:#1b1b17;overflow:hidden}.info{padding:22px 24px 16px;display:flex;justify-content:space-between;gap:12px}.number{font-size:11px;color:var(--gold);letter-spacing:2px}.info h2{font-weight:500;font-size:20px;margin:8px 0}.info p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}.tag{align-self:flex-start;color:#bdbbb2;font-size:10px;border:1px solid var(--line);border-radius:20px;padding:6px 10px;white-space:nowrap}.stage{display:flex;justify-content:center;align-items:center;min-height:284px;background:radial-gradient(ellipse at center,#26241e,#181815 70%);padding:16px}.screen{width:320px;max-width:100%;aspect-ratio:5/4;border:1px solid #34332e;border-radius:7px;box-shadow:0 14px 32px #0008;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}.controls{padding:16px 24px 20px;display:flex;gap:12px;align-items:center}.hold{touch-action:none;user-select:none;min-width:126px}.hold.active{border-color:var(--gold);background:#423728}.status{font-size:12px;color:var(--muted);line-height:1.5}.footnote{font-size:12px;line-height:1.8;color:var(--muted);margin-top:24px}@media(max-width:760px){main{padding:28px 16px}.grid{grid-template-columns:1fr}h1{font-size:27px}.toolbar small{margin-left:0}.info{padding-inline:18px}.controls{padding-inline:18px}}
</style>
</head>
<body><main>
<header><div class="eyebrow">POMODORO / SPARK STUDIES</div><h1>沿着时间，点燃一圈小火花。</h1><p>四种仙女棒式燃烧：从顶部顺时针走完一圈，经过的白色圆环立即变灰。按住 A 试试，中途松手，计时照常继续。</p></header>
<div class="toolbar"><button class="primary" id="compare">四款同步演示</button><button id="reset">重置预览</button><label><input id="actual" type="checkbox">原尺寸 160 × 128</label><small>长按识别 360 ms ＋ 燃烧 2 秒 · 无声音</small></div>
<div class="grid" id="grid"></div>
<p class="footnote">默认 2 倍放大，方便比较细节；勾选原尺寸可观察小屏表现。同步演示会自动完成一圈；每张卡片的「按住 A」可测试提前松开。火花采用浏览器柔光绘制，最终 ESP32 版本需依据小屏性能调整，当前未修改固件。</p>
</main>
<script>
'use strict';
const variants=[
 {name:'金色细火花',desc:'暖金短针，轻轻散开。最接近一支小仙女棒。',tag:'推荐 · 均衡',color:'#ffd288',kind:0},
 {name:'银白星芒',desc:'冷白星尖与细碎亮点，清爽、精致。',tag:'清冷 · 干净',color:'#dfedff',kind:1},
 {name:'暖橙余烬',desc:'柔和燃点，少量橙色余烬缓缓坠落。',tag:'温暖 · 柔和',color:'#ffae65',kind:2},
 {name:'切向飞丝',desc:'几缕细丝沿前进方向飞出，利落而轻盈。',tag:'轻快 · 锐利',color:'#ffe4a8',kind:3}
];
const TAU=Math.PI*2,R=40.5,CX=80,CY=64,states=[];
const frac=x=>x-Math.floor(x),noise=n=>frac(Math.sin(n*127.1+311.7)*43758.5453);
function position(p){const a=-Math.PI/2+p*TAU;return{x:CX+R*Math.cos(a),y:CY+R*Math.sin(a),a};}
for(const [i,v] of variants.entries()){
 const card=document.createElement('section');card.className='card';card.innerHTML=`<div class="info"><div><div class="number">0${i+1} / SPARK</div><h2>${v.name}</h2><p>${v.desc}</p></div><span class="tag">${v.tag}</span></div><div class="stage"><div class="screen"><canvas width="640" height="512" aria-label="${v.name}，长按取消动画"></canvas></div></div><div class="controls"><button class="hold" aria-label="按住 A 体验${v.name}">按住 A</button><span class="status" aria-live="polite">专注中 · 可提前松开</span></div>`;
 document.querySelector('#grid').append(card);
 const s={v,canvas:card.querySelector('canvas'),button:card.querySelector('.hold'),status:card.querySelector('.status'),mode:'running',hold:null,auto:false,burn:0,remaining:18*60+24,last:performance.now(),completed:0};states.push(s);
 s.button.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();s.button.setPointerCapture(e.pointerId);begin(s,performance.now(),false)});
 s.button.addEventListener('pointerup',()=>release(s));s.button.addEventListener('pointercancel',()=>release(s));s.button.addEventListener('lostpointercapture',()=>release(s));
 s.button.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();begin(s,performance.now(),false)}});
 s.button.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release(s)}});
}
function begin(s,now,auto){if(s.hold!==null)return;if(s.mode==='paused'){s.mode='running';s.last=now}else if(s.mode==='idle'){restart(s,now)}s.hold=now;s.auto=auto;s.burn=0;s.button.classList.add('active');s.status.textContent='保持按住 · 即将点燃';}
function release(s){if(s.hold===null)return;const burning=s.burn>0;s.hold=null;s.auto=false;s.burn=0;s.button.classList.remove('active');if(s.mode==='running'){if(burning){s.status.textContent='已松开 · 计时继续'}else{s.mode='paused';s.status.textContent='短按暂停 · 再按恢复演示'}}}
function restart(s,now){s.mode='running';s.hold=null;s.auto=false;s.burn=0;s.remaining=18*60+24;s.last=now;s.button.classList.remove('active');s.status.textContent='专注中 · 可提前松开';}
document.querySelector('#compare').onclick=()=>{const now=performance.now();states.forEach(s=>{restart(s,now);begin(s,now,true)});};
document.querySelector('#reset').onclick=()=>states.forEach(s=>restart(s,performance.now()));
document.querySelector('#actual').onchange=e=>document.querySelectorAll('.screen').forEach(el=>el.style.width=e.target.checked?'160px':'320px');
window.addEventListener('blur',()=>states.forEach(release));document.addEventListener('visibilitychange',()=>{if(document.hidden)states.forEach(release)});
function arc(c,start,end,color,width=5){if(end<=start)return;c.beginPath();c.arc(CX,CY,R,-Math.PI/2+start*TAU,-Math.PI/2+end*TAU);c.lineWidth=width;c.strokeStyle=color;c.lineCap='butt';c.stroke();}
function line(c,x,y,xx,yy,color,width,alpha){c.globalAlpha=alpha;c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(xx,yy);c.stroke();}
function spark(c,s,t){
 const p=Math.min(t/2000,1),head=position(p),kind=s.v.kind,col=s.v.color;
 // Particles are sampled from fixed emission times, so density is independent of frame rate.
 const interval=[14,19,22,16][kind],life=[220,180,300,230][kind],max=[9,8,7,11][kind];
 c.save();c.globalCompositeOperation='lighter';
 const glow=c.createRadialGradient(head.x,head.y,0,head.x,head.y,4);glow.addColorStop(0,col+'55');glow.addColorStop(.35,col+'18');glow.addColorStop(1,col+'00');c.fillStyle=glow;c.fillRect(head.x-4,head.y-4,8,8);
 for(let n=Math.max(0,Math.floor((t-life)/interval));n<=Math.floor(t/interval);n++){
  const age=t-n*interval;if(age<0||age>life)continue;
  const born=position(n*interval/2000),u=age/life,k=n+kind*1000;
  const a=kind===3?born.a+Math.PI/2+(noise(k)-.5)*1.5:noise(k)*TAU;
  const speed=2+noise(k+8)*max,d=speed*(u*1.6);const x=born.x+Math.cos(a)*d,y=born.y+Math.sin(a)*d+(kind===2?u*u*6:u*u*1.3);
  const alpha=Math.pow(1-u,1.3);const length=((kind===3?4.2:kind===2?1.7:2.6)*(1-u)+.3);
  const color=kind===2?(u>.45?'#e7783e':'#ffd8a0'):(noise(k+15)>.7?'#fff9e9':col);
  line(c,x,y,x-Math.cos(a)*length,y-Math.sin(a)*length,color,kind===2?1:.55,alpha);
  if(kind===1&&noise(k+7)>.65){line(c,x-1,y,x+1,y,color,.35,alpha);line(c,x,y-1,x,y+1,color,.35,alpha)}
 }
 // Uneven, flickering spokes make the head a sparkler rather than a glowing dot.
 for(let j=0;j<(kind===1?8:kind===2?7:11);j++){
  const phase=Math.floor(t/45),seed=phase*17+j+kind*900;
  const a=kind===3?head.a+Math.PI/2+(noise(seed)-.5)*4:noise(seed)*TAU;
  const len=2.5+noise(phase*9+j)*(kind===3?7.5:6);
  const start=.6+noise(seed+4)*1.4;
  line(c,head.x+Math.cos(a)*start,head.y+Math.sin(a)*start,head.x+Math.cos(a)*len,head.y+Math.sin(a)*len,noise(seed+5)>.65?'#fff9e9':col,.45+noise(seed+6)*.3,.5+noise(phase+j)*.45);
 }
 c.globalAlpha=1;c.shadowColor=col;c.shadowBlur=.7;c.fillStyle='#fff9e9';c.beginPath();c.arc(head.x,head.y,.85,0,TAU);c.fill();c.restore();
}
function draw(s,now){const c=s.canvas.getContext('2d');c.setTransform(4,0,0,4,0,0);c.clearRect(0,0,160,128);c.fillStyle='#000';c.fillRect(0,0,160,128);
 c.textAlign='center';c.fillStyle='#f2f2f2';c.font='12px "PingFang SC",sans-serif';c.fillText(s.mode==='idle'?'专注':s.mode==='paused'?'已暂停':'专注',80,15);
 arc(c,0,1,'#383838');const ratio=s.mode==='idle'?1:s.remaining/1500;arc(c,1-ratio,1,'#f2f2f2');if(s.burn>0)arc(c,0,Math.min(s.burn/2000,1),'#383838');
 const seconds=s.mode==='idle'?1500:Math.ceil(s.remaining);c.font='20px ui-monospace,Menlo,monospace';c.fillText(String(Math.floor(seconds/60)).padStart(2,'0'),55,71);c.fillText(String(seconds%60).padStart(2,'0'),105,71);
 // Compact glass hourglass in the existing central layout.
 c.strokeStyle='#e8e8e8';c.lineWidth=.8;c.beginPath();c.moveTo(72,48);c.lineTo(88,48);c.lineTo(86,56);c.lineTo(80,63);c.lineTo(86,70);c.lineTo(88,80);c.lineTo(72,80);c.lineTo(74,70);c.lineTo(80,63);c.lineTo(74,56);c.closePath();c.stroke();
 c.fillStyle='#f2f2f2';c.beginPath();c.moveTo(75,55);c.lineTo(85,55);c.lineTo(80,61);c.closePath();c.fill();c.beginPath();c.moveTo(74,77);c.lineTo(86,77);c.lineTo(80,71);c.closePath();c.fill();line(c,80,65,80,69,'#c8c8c8',.6,.7);
 c.font='9px "PingFang SC",sans-serif';c.fillStyle='#bdbdbd';c.fillText(s.burn>0?'松开继续':s.mode==='idle'?'A 开始    ↑ 设置    B 返回':s.mode==='paused'?'继续 / 重置':'A 暂停    ↑ 设置    B 返回',80,121);
 if(s.burn>0)spark(c,s,s.burn);
}
function frame(now){for(const s of states){const dt=(now-s.last)/1000;s.last=now;if(s.mode==='running')s.remaining=Math.max(0,s.remaining-dt);if(s.hold!==null&&s.mode==='running'){const elapsed=now-s.hold;if(elapsed>=360){s.burn=Math.min(elapsed-360,2000);s.status.textContent='正在燃烧 · 松开继续';if(elapsed>=2360){s.mode='idle';s.hold=null;s.burn=0;s.auto=false;s.button.classList.remove('active');s.status.textContent='已取消 · 准备页 25:00，配置保留'}}}draw(s,now)}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
